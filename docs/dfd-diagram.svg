<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold">学校会計システム DFD</text>

  <rect x="80" y="110" width="160" height="70" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">学校職員・管理者</text>

  <rect x="320" y="110" width="180" height="70" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">メニュー処理</text>

  <rect x="560" y="110" width="180" height="70" rx="8" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">業務処理</text>

  <rect x="320" y="290" width="180" height="70" rx="8" ry="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">残高データ処理</text>

  <rect x="560" y="290" width="180" height="70" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">残高データ</text>

  <line x1="240" y1="145" x2="320" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="145" x2="560" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="180" x2="650" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="325" x2="500" y2="325" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="290" x2="410" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="290" x2="650" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="260" y="132" font-family="Arial, sans-serif" font-size="13">操作選択</text>
  <text x="518" y="132" font-family="Arial, sans-serif" font-size="13">処理要求</text>
  <text x="670" y="240" font-family="Arial, sans-serif" font-size="13">残高取得/更新</text>
  <text x="530" y="313" font-family="Arial, sans-serif" font-size="13">保存・取得</text>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="13">結果返却</text>
  <text x="660" y="240" font-family="Arial, sans-serif" font-size="13">保存済み残高</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
